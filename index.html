<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Travel & Budget Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-extrabold text-indigo-700">🌍 Smart AI Travel Companion</h1>
            <p class="text-gray-600 mt-2">Accurate Budget Breakdown, Verified Hotels, Sightseeing & Food Spots</p>
        </div>

        <!-- VIEW 1: Input Form -->
        <div id="form-view" class="bg-white shadow-2xl rounded-2xl p-6 md:p-8 border border-indigo-100">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">From (Current Location):</label>
                    <input type="text" id="origin" placeholder="e.g., Kolkata" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Destination:</label>
                    <input type="text" id="destination" placeholder="e.g., Darjeeling / Karimpur" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Duration (Days):</label>
                    <input type="number" id="days" placeholder="e.g., 3" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Total Budget (INR):</label>
                    <input type="number" id="budget" placeholder="e.g., 8000" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>

            <button onclick="generateTrip()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-4 rounded-xl hover:opacity-90 transition shadow-lg text-lg">
                Generate Accurate Trip Plan 🚀
            </button>

            <!-- Loading Spinner -->
            <div id="loading" class="hidden text-center mt-8">
                <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-indigo-600 mx-auto"></div>
                <p class="text-gray-600 mt-3 font-medium">AI is analyzing exact routes, hotels & costs...</p>
            </div>
        </div>

        <!-- VIEW 2: Dashboard Summary (Initially Hidden) -->
        <div id="dashboard-view" class="hidden space-y-6"></div>

        <!-- VIEW 3: Detail Pages (Hotels / Sightseeing / Food) (Initially Hidden) -->
        <div id="detail-view" class="hidden bg-white shadow-2xl rounded-2xl p-6 md:p-8 border border-indigo-100"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
